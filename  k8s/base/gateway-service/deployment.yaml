apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
    template:
      metadata:
        labels:
          app: gateway-service
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
        containers:
          - name: gateway-service
            image: gateway-service
            ports:
              - name: http
                containerPort: 8080
            envFrom:
              - configMaRef:
                  name: gateway-service-config
            resources:
              requests:
                cpu: 250m
                memory: 384Mi
              limits:
                cpu: "1"
                memory: 768Mi
            livenessProbe:
              httpGet:
                path: /actuator/health/liveness
                port: http
              initialDelaySeconds: 20
              periodSeconds: 10
            readinessProbe:
              httpGet:
                path: /actuator/health/readiness
                port: http
              initialDelaySeconds: 10
              periodSeconds: 5