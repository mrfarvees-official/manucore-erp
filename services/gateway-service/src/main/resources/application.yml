server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          httpClient:
            connect-timeout: 2000
            response-timeout: 30s
          default-filters:
            - DedupeResponseHeader=Access-Control-All-Credentials Access-Control-Allow-Origin, RETAIN_UNIQUE
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ORIGINS:http://localhost:3000}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                exposedHeaders: [X-Correlation-Id]
                maxAge: 3600
          routes:
            - id: identity-tenant-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/auth/**

            - id: authorization-service
              uri: ${AUTHORIZATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/authorization/**

            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/inventory/**

manucore:
  security:
    tenant-claim: ${TENANT_CLAIM:tenant_id}
    # Number of trusted reverse proxies in front of the gateway (0 = use the socket address).
    # Behind one ALB / ingress set 1 so X-Forwarded-For is trusted for exactly that hop.
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:0}
  authorization:
    url: ${AUTHORIZATION_SERVICE_URL:http://localhost:8083}
    timeout: ${AUTHORIZATION_TIMEOUT:PT2S}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: "!dev-open"
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys published by identity-tenant-service. With keycloak later, switch to issuer-uri
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8082/api/v1/auth/jwks}