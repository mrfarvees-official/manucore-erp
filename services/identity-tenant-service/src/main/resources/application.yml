server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: identity-tenant-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/manucore}
    username: ${SPRING_DATASOURCE_USERNAME:manucore}
    password: ${SPRING_DATASOURCE_PASSWORD:manucore}
  jpa:
    hibernate:
      ddl-auto: update

manucore:
  identity:
    issuer: ${JWT_ISSUER:manucore-identity}
    token-ttl: ${JWT_TTL:PT1H}
    seed-demo-data: ${SEED_DEMO_DATA:true}
    demo-password: ${DEMO_PASSWORD:Admin@123}
    domain-login: ${DOMAIN_LOGIN:off}        # off | strict
    base-domains: ${BASE_DOMAINS:localhost}  # comma separated, e.g. erp.example.com
  authorization:
    url: ${AUTHORIZATION_SERVICE_URL:http://localhost:8083}
    timeout: ${AUTHORIZATION_TIMEOUT:PT2S}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true