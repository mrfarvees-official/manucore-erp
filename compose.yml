services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: manucore
      POSTGRES_PASSWORD: manucore
      POSTGRES_DB: manucore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manucore -d manucore"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Internal services publish no host ports: everything must go through the gateway,
  # because the gateway is where authorization is enforced.
  identity-tenant-service:
    build:
      context: .
      dockerfile: services/identity-tenant-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/manucore
      SPRING_DATASOURCE_USERNAME: manucore
      SPRING_DATASOURCE_PASSWORD: manucore
      SEED_DEMO_DATA: "true"
      BASE_DOMAINS: "manucore.farvees.xyz,localhost"
      DOMAIN_LOGIN: "off"
      AUTHORIZATION_SERVICE_URL: http://authorization-service:8083
    depends_on:
      postgres:
        condition: service_healthy

  authorization-service:
    build:
      context: .
      dockerfile: services/authorization-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/manucore
      SPRING_DATASOURCE_USERNAME: manucore
      SPRING_DATASOURCE_PASSWORD: manucore
      JWT_JWK_SET_URI: http://identity-tenant-service:8082/api/v1/auth/jwks
      SEED_TENANTS: acme
    depends_on:
      postgres:
        condition: service_healthy
      identity-tenant-service:
        condition: service_started

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/manucore
      SPRING_DATASOURCE_USERNAME: manucore
      SPRING_DATASOURCE_PASSWORD: manucore
      SEED_DEMO_DATA: "true"
      SEED_TENANTS: acme
    depends_on:
      postgres:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    environment:
      # "dev-open" disables authentication AND authorization. Use it deliberately.
      SPRING_PROFILES_ACTIVE: ${GATEWAY_PROFILE:-secured}
      INVENTORY_SERVICE_URL: http://inventory-service:8081
      IDENTITY_SERVICE_URL: http://identity-tenant-service:8082
      AUTHORIZATION_SERVICE_URL: http://authorization-service:8083
      JWT_JWK_SET_URI: http://identity-tenant-service:8082/api/v1/auth/jwks
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - inventory-service
      - identity-tenant-service
      - authorization-service
    ports:
      - "8080:8080"

volumes:
  pgdata: