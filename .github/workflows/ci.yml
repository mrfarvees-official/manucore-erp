name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: manucore
          POSTGRES_USER: manucore
          POSTGRES_PASSWORD: manucore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manucore -d manucore"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install Maven 3.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Build and test
        run: >
          mvn -B -ntp verify
          -pl services/identity-tenant-service,services/authorization-service,services/inventory-service,services/gateway-service
          -am

      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"